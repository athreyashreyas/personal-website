<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editor · Shreyas Athreya</title>
<link rel="stylesheet" href="/editor.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Editor</div>
      <div class="topbar-status" id="status" aria-live="polite"></div>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
    </header>
    <div class="shell">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="main" id="main"></main>
    </div>
  </div>
  <script src="/editor.js"></script>
</body>
</html>
